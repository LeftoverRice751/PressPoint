<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Kiosk</title>
  <link rel="stylesheet" href="/assets/css/welcome-screen.css" />
  <style>
    #kiosk-stage {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #000;
      overflow: hidden;
      cursor: pointer;
    }

    #kiosk-stage[hidden] {
      display: none;
    }

    #kiosk-loading {
      position: absolute;
      inset: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 0.9rem;
      background: radial-gradient(circle at center, rgba(15, 23, 42, 0.9), rgba(0, 0, 0, 0.98));
      color: #e2e8f0;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    #kiosk-loading.is-visible {
      opacity: 1;
      pointer-events: auto;
    }

    #kiosk-video-overlay {
      position: absolute;
      inset: 0;
      z-index: 4;
      display: none;
      align-items: stretch;
      justify-content: stretch;
      padding: 0;
      background: rgba(2, 6, 23, 0.94);
      cursor: default;
    }

    #kiosk-video-overlay.is-visible {
      display: flex;
    }

    #kiosk-video-wrap {
      position: absolute;
      inset: 0;
      z-index: 5;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      opacity: 0;
      transform: scale(1);
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    #kiosk-video-wrap.is-visible {
      opacity: 1;
      transform: scale(1);
    }

    #kiosk-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      vertical-align: middle;
      background: #000;
    }

    #kiosk-status {
      position: absolute;
      left: 1rem;
      right: 1rem;
      bottom: 1rem;
      z-index: 4;
      margin: 0;
      color: #cbd5e1;
      font-size: 0.95rem;
      text-align: center;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.75);
      pointer-events: none;
    }

    #kiosk-config {
      display: none;
    }

    #lock-overlay {
      display: none;
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      z-index: 10000;
      color: white;
      text-align: center;
      padding-top: 20%;
      font-family: sans-serif;
      touch-action: none;
    }

    #kiosk-notice {
      position: fixed;
      left: 50%;
      bottom: 1.25rem;
      z-index: 10001;
      max-width: min(92vw, 42rem);
      transform: translateX(-50%) translateY(1rem);
      opacity: 0;
      pointer-events: none;
      border-radius: 999px;
      padding: 0.9rem 1.15rem;
      background: rgba(15, 23, 42, 0.92);
      color: #f8fafc;
      font-size: 0.95rem;
      line-height: 1.35;
      letter-spacing: 0.01em;
      box-shadow: 0 12px 32px rgba(15, 23, 42, 0.32);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    #kiosk-notice.is-visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    #kiosk-notice[data-tone="success"] {
      background: rgba(21, 128, 61, 0.95);
    }

    #kiosk-notice[data-tone="warning"] {
      background: rgba(180, 83, 9, 0.95);
    }

    #kiosk-notice[data-tone="danger"] {
      background: rgba(153, 27, 27, 0.95);
    }

    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.55rem;
      padding-top: 0.25rem;
      text-align: center;
    }

    .hero__logo {
      width: min(28vw, 12rem);
      height: auto;
      display: block;
      filter: drop-shadow(0 10px 30px rgba(0, 0, 0, 0.35));
    }

    .hero__title {
      margin: 0;
      color: #111111;
      font-size: clamp(2.15rem, 5.6vw, 4.85rem);
      font-weight: 900;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      line-height: 1;
    }

    .hero__subtitle {
      margin: 0;
      max-width: 30rem;
      color: #111111;
      font-size: clamp(0.9rem, 1.45vw, 1.1rem);
      line-height: 1.5;
      letter-spacing: 0.03em;
    }
  </style>
</head>
<body>
  <div class="kiosk-shell">
    <main class="kiosk-app" aria-label="Kiosk terminal">
      <section class="hero" aria-label="Brand mark">
        <img class="hero__logo" src="/gears.png?v=20260411" alt="Gears logo" />
        <h1 class="hero__title">PRESSPOINT</h1>
        <p class="hero__subtitle">The Gears Publication's Official Kiosk</p>
      </section>

      <section class="feature-grid" aria-label="Kiosk actions">
        <button class="feature-card" type="button" data-card="Latest News" data-target="/kiosk/latest-news">
          <span class="feature-card__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M5 6h14"></path>
              <path d="M5 10h14"></path>
              <path d="M5 14h9"></path>
              <path d="M5 18h6"></path>
            </svg>
          </span>
          <span class="feature-card__label">Latest News</span>
          <span class="feature-card__hint">Read recent updates</span>
        </button>

        <button class="feature-card" type="button" data-card="Campus Map" data-target="/kiosk/campus-map">
          <span class="feature-card__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M9 5 3 7.8v11.2l6-2.8 6 2.8 6-2.8V5l-6 2.8L9 5Z"></path>
              <path d="M9 7.8v11.2"></path>
              <path d="M15 8.6v11"></path>
            </svg>
          </span>
          <span class="feature-card__label">Campus Map</span>
          <span class="feature-card__hint">Find every location</span>
        </button>

        <button class="feature-card" type="button" data-card="Gears Archive" data-target="{{ route('kiosk.gears-archive') }}">
          <span class="feature-card__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M8 11.5a4 4 0 1 1 8 0"></path>
              <path d="M6.5 18.5a6.8 6.8 0 0 1 11 0"></path>
              <path d="M12 5.5v2"></path>
              <path d="M16.3 7.2 15.1 8.4"></path>
              <path d="M7.7 7.2 8.9 8.4"></path>
            </svg>
          </span>
          <span class="feature-card__label">Gears Archive</span>
          <span class="feature-card__hint">Browse our archives</span>
        </button>

        <button class="feature-card" type="button" data-card="Virtual Tour" data-target="/kiosk/virtual-tour">
          <span class="feature-card__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M7 5.5 17.5 12 7 18.5V5.5Z"></path>
            </svg>
          </span>
          <span class="feature-card__label">Virtual Tour</span>
          <span class="feature-card__hint">Preview the campus</span>
        </button>

        <button class="feature-card" type="button" data-card="About LSPU" data-target="{{ route('kiosk.about-lspu') }}">
          <span class="feature-card__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="8.5"></circle>
              <path d="M12 11v5.5"></path>
              <path d="M12 7.75v.5"></path>
            </svg>
          </span>
          <span class="feature-card__label">About LSPU</span>
          <span class="feature-card__hint">Learn about the university</span>
        </button>

        <button class="feature-card" type="button" data-card="LSPU Organizational Chart" data-target="{{ route('kiosk.org-chart') }}">
          <span class="feature-card__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <rect x="9.5" y="3.5" width="5" height="4" rx="0.6"></rect>
              <rect x="3.5" y="15.5" width="5" height="4" rx="0.6"></rect>
              <rect x="9.5" y="15.5" width="5" height="4" rx="0.6"></rect>
              <rect x="15.5" y="15.5" width="5" height="4" rx="0.6"></rect>
              <path d="M12 7.5v3"></path>
              <path d="M6 15.5v-2.5h12v2.5"></path>
              <path d="M12 13v2.5"></path>
            </svg>
          </span>
          <span class="feature-card__label">LSPU Org Chart</span>
          <span class="feature-card__hint">View leadership structure</span>
        </button>
      </section>

      <section class="news-ticker" aria-label="Flash updates">
        <div class="news-ticker__label">FLASH UPDATES</div>
        <div class="news-ticker__viewport">
          <div class="news-ticker__track" id="ticker-track"></div>
        </div>
      </section>
    </main>

  </div>

  <div
    id="kiosk-config"
    data-pusher-key="{{ pusher_key }}"
    data-pusher-cluster="{{ pusher_cluster }}"
    data-flash-updates-url="{{ route('welcome.flash-updates') }}"
  ></div>

  <div id="kiosk-stage" hidden aria-live="polite">
    <div id="kiosk-loading" aria-hidden="true">
      <div class="kiosk-spinner"></div>
      <div class="kiosk-loading-title">Loading video</div>
      <div class="kiosk-loading-subtitle">Preparing kiosk playback…</div>
    </div>

    <div id="kiosk-video-overlay" aria-hidden="true">
      <div id="kiosk-video-wrap">
        <video id="kiosk-video" playsinline preload="metadata"></video>
      </div>
      <p id="kiosk-status">Waiting for editorial to start a video…</p>
    </div>
  </div>

  <div id="lock-overlay" aria-hidden="true"></div>

  <div id="kiosk-notice" role="status" aria-live="polite" aria-atomic="true"></div>

  <script src="/assets/js/welcome-screen.js" defer></script>
  <script src="/assets/js/app.js" defer></script>
  <script src="/assets/js/welcome-lock.js" defer></script>
</body>
</html>
