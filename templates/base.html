<!DOCTYPE html>
<html lang="en"{% block html_attrs %}{% endblock %}>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>{% block title %}PressPoint{% endblock %}</title>
    <link rel="icon" href="{{ site_logo() }}">
    <!-- No Tailwind. This used to pull tailwindcss@^2 from unpkg.com: 2.8 MB of
         render-blocking, cross-origin CSS on every page extending this base —
         measured at 10.3s to fetch — for which the codebase had exactly zero
         utility classes. Every template here is BEM against its own stylesheet.
         The kiosk must not block first paint on a third-party CDN it cannot
         reach when the campus link is down. -->
    <link rel="stylesheet" href="{{ asset_url('css/kiosk-tokens.css') }}">

    {% block head %}
    <!-- <link rel="stylesheet" href="{{ asset_url('css/app.css') }}"> -->
    {% endblock %}
  </head>
  <body>
    {% block content %}{% endblock %}
    {% block js %}
    <!-- <script src="{{ asset_url('js/app.js') }}"></script> -->
    {% endblock %}
  </body>
</html>
