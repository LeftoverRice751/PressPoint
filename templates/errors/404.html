<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found &middot; The Gears</title>
  <link rel="icon" href="{{ site_logo() }}">
  <link rel="stylesheet" href="{{ asset_url('css/kiosk-tokens.css') }}">
  <link rel="stylesheet" href="{{ asset_url('css/error-page.css') }}">
</head>

<body class="error-page">
  {% block content %}
  <main class="error-card">
    <svg class="error-card__mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
      <circle cx="11" cy="11" r="6.5"/>
      <path d="M20 20l-4.5-4.5"/>
      <path d="M9 9.5a2 2 0 1 1 3.2 1.6c-.7.5-1.2 1-1.2 1.9" stroke-linecap="round"/>
      <circle cx="11" cy="15.2" r="0.15" fill="currentColor" stroke="currentColor" stroke-width="1.4"/>
    </svg>
    <p class="error-card__code">404</p>
    <h1 class="error-card__title">That page wandered off</h1>
    <p class="error-card__text">We looked. It's not here. Moved, renamed, or never existed — whichever it is, this link's a dead end now.</p>
    <p class="error-card__actions"><a class="error-card__link" href="/kiosk">Back to the kiosk</a></p>
  </main>
  {% endblock %}
</body>

</html>
