{% extends 'auth/base.html' %}

{% block title %}Change Password{% endblock %}

{% block content %}
<section class="auth-panel auth-panel--narrow">
    <div class="auth-panel__header">
        <div class="auth-panel__eyebrow">Account recovery</div>
        <h2 class="auth-panel__title">Change Password</h2>
        <p class="auth-panel__subtitle">Enter a new password for your account.</p>
    </div>

    <form class="auth-form" method="POST" action="{{ route('auth.change-password.store', {'token': token}) }}">
        {{ csrf_field | safe }}

        <label class="auth-form__group" for="password">
            <span class="auth-form__label">New Password</span>
            <div class="password-field">
                <input id="password" type="password" name="password" autocomplete="new-password" class="auth-form__input pr-20" required />
                <button type="button" class="password-toggle" data-password-toggle="password">See</button>
            </div>
        </label>

        <div class="space-y-2">
            <div class="strength-meter" aria-hidden="true">
                <div class="strength-meter-bar" id="password-strength-bar"></div>
            </div>
            <div class="strength-label" id="password-strength-label">Use 8 characters, a number, and a special character.</div>
        </div>

        <label class="auth-form__group" for="password_confirmation">
            <span class="auth-form__label">Confirm Password</span>
            <div class="password-field">
                <input id="password_confirmation" type="password" name="password_confirmation" autocomplete="new-password" class="auth-form__input pr-20" required />
                <button type="button" class="password-toggle" data-password-toggle="password_confirmation">See</button>
            </div>
        </label>

        <button type="submit" class="auth-form__button">Update Password</button>
    </form>
</section>
{% endblock %}

{% block js %}
<script src="/assets/js/auth-change-password.js" defer></script>
{% endblock %}
