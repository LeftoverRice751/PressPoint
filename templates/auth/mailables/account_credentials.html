<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Presspoint Account</title>
    <style>
        html {
            background-color: #CBD5E1;
        }

        .button {
            color: white;
            padding: 10px 14px;
            background-color: #1F2937;
            text-decoration: none;
            display: inline-block;
            margin-top: 16px;
        }
    </style>
</head>
<body>
    <div style="width: 98%; background-color: white; margin-right: 10px; padding: 20px">
        <h3>Hello,</h3>
        <p>Your Presspoint account has been created.</p>
        <p><strong>Username:</strong> {{ username }}</p>
        <p><strong>Temporary Password:</strong> {{ password }}</p>
        <p>Use these details to log in and access the gears dashboard.</p>
        <p>
            <a class="button" href="{{ route('auth.login') }}">Go to Login</a>
        </p>
    </div>
</body>
</html>
