[flake8]
max-line-length = 99
# `venv` (no dot) is this repo's virtualenv. The stock Masonite config only
# excluded `.venv`, so `make lint` walked all 85 installed packages and never
# finished -- which is why linting had been effectively unrunnable here.
exclude = .git,.venv,venv,.idea,templates,resources,storage,
    databases/migrations,node_modules,__pycache__,.pytest_cache,
    .worktrees,.superpowers
# `extend-ignore`, not `ignore`: plain `ignore=` REPLACES flake8's default
# ignore list (E121,E123,E126,E226,E24,E704,W503,W504), which is why every
# model's closing bracket used to be reported as E123.
extend-ignore = E501,F401,E203,E128,E402,E731,F821,E712,F811

[coverage:run]
include = backend/*
omit = *migrations*, *tests*, config/*, manage.py, conftest.py
