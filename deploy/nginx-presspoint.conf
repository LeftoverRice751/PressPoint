# PressPoint nginx site config.
#
# Install:
#   sudo cp deploy/nginx-presspoint.conf /etc/nginx/sites-enabled/presspoint
#   sudo nginx -t && sudo systemctl reload nginx
#
# Why this file exists: before this, a single `location /` proxied 100% of
# traffic to gunicorn, so every CSS file, image, archive PDF and video byte
# was served by a synchronous Python worker — and VideoController.serve_storage
# reads the requested range into memory rather than streaming it. With only a
# handful of workers, a few kiosks playing video could starve every editor.
# nginx serves those paths directly here, with sendfile, and Python only sees
# real application requests.

server {
    listen 80;
    server_name presspoint-gears.me;

    client_max_body_size 500M;

    disable_symlinks off;

    # ── Gray Raven Protocol ───────────────────────────────────────────
    # Everybody reaches this site through the cloudflared tunnel, which runs
    # on this same machine. That means nginx sees every connection as coming
    # from 127.0.0.1, and would write 127.0.0.1 in the log for every visitor
    # on earth — useless for working out who is attacking us. Cloudflare puts
    # the visitor's real address in a CF-Connecting-IP header, and the lines
    # below tell nginx to believe it.
    #
    # "set_real_ip_from 127.0.0.1" is the safety catch, and it matters: the
    # header is trusted ONLY when the connection genuinely came from the
    # tunnel on this machine. Somebody on the office LAN hitting port 80
    # directly cannot send a fake CF-Connecting-IP and be believed — they
    # keep their own address. Without that line anyone could pretend to be
    # anyone, and Battle Mode would cheerfully block whoever an attacker
    # felt like framing.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header   CF-Connecting-IP;
    real_ip_recursive on;

    # lyn's own visitor book, and the only thing the Gray Raven reads.
    #
    # The shape of each line is defined once at the top level, in
    # /etc/nginx/conf.d/gray_raven_format.conf, because nginx only allows
    # log_format to be declared there and not inside a server block.
    #
    # Deliberately NOT in /tmp, which is the tempting choice and quietly the
    # wrong one: fs.protected_regular=2 stops any process - root included -
    # from opening a file in a world-writable folder like /tmp when somebody
    # else owns it. One stray file left there by another user, and nginx
    # refuses to start. /var/log/nginx is nginx's own folder, is not
    # world-writable, and logrotate already looks after it.
    access_log /var/log/nginx/presspoint_gray_raven.log gray_raven;

    # The addresses Battle Mode has shut out. lyn writes this file; never
    # edit it by hand. It always exists, even while empty, because nginx
    # refuses to start when an included file is missing.
    include /etc/nginx/gray_raven/blocklist.conf;

    # What a blocked visitor sees. A "deny" in the file above produces a
    # 403, and a 403 gets this page instead of nginx's bare default one.
    error_page 403 /gray_raven.html;
    location = /gray_raven.html {
        root /etc/nginx/gray_raven/page;
        internal;

        # "allow all" is doing real work here, and deleting it silently breaks
        # the whole feature. The deny list above sits at SERVER level, so it
        # applies again when nginx internally re-requests this page to show it
        # to the person it just denied - the page explaining the block gets
        # blocked too, and nginx gives up and serves its own bare "403
        # Forbidden". A location that defines its own access rule ignores the
        # inherited one, which is precisely what this line is for.
        allow all;
    }

    # ── Static and media, served by nginx ─────────────────────────────
    # Regex locations are matched before prefix locations, so this block
    # claims the NAS-backed folders and the /storage/ block below gets
    # everything else. The folder list mirrors StorageRouter.NAS_FOLDERS
    # in app/services/StorageRouter.py — keep the two in sync.
    location ~ ^/storage/((?:Archives|Videos|About|Branding|Profiles|Events)/.*)$ {
        alias /mnt/nas_storage/gears_data/$1;
        add_header Cache-Control "public, max-age=86400";
        # NOTE: error_page, not try_files. try_files inside a location that
        # uses alias is a long-standing nginx footgun (it resolves $uri
        # against the wrong root); error_page 404 is the reliable form.
        error_page 404 = @app;
    }

    # Everything else under /storage/ resolves to the project's public
    # folder — StorageRouter.public_base() -> storage/framework/public.
    location /storage/ {
        alias /home/leftoverrice/Downloads/presspoint/storage/framework/public/;
        add_header Cache-Control "public, max-age=86400";
        error_page 404 = @app;
    }

    # Compiled CSS/JS. STATICFILES in config/filesystem.py maps
    # storage/compiled -> assets/.
    #
    # A year, and `immutable`, rather than the 7d this used to carry. These
    # URLs are stamped ?v=<mtime> by app/services/AssetVersion.py, so a rebuilt
    # file is a different URL and a stale one can never be requested: the
    # expiry was only ever costing a conditional request per asset per week.
    # `immutable` additionally stops the browser revalidating on a reload,
    # which is the case that actually mattered here — the kiosk reloads far
    # more often than it is redeployed. sw-kiosk.js already treats /assets/ as
    # cache-first for exactly the same reason.
    location /assets/ {
        alias /home/leftoverrice/Downloads/presspoint/storage/compiled/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        error_page 404 = @app;
    }

    # Panorama tiles + the Marzipano vendor bundle for the kiosk virtual
    # tour, ~360 MB under storage/public/pano. Without this block they fall
    # through to `location /` and stream out of a gunicorn worker, which is
    # exactly what pinned workers before /storage/ got its own block above.
    # A capture is immutable — a re-export replaces the whole tree — so a
    # long expiry is safe.
    location /pano/ {
        alias /home/leftoverrice/Downloads/presspoint/storage/public/pano/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        # error_page, not try_files — see the alias note above.
        error_page 404 = @app;
    }

    # The virtual tour's 3D citizen's charter (a ~1.4 MB GLB). Same reasoning
    # as the /pano/ block above: STATICFILES maps storage/public to "/", which
    # has no location of its own, so without this the model falls through to
    # `location /` and streams out of a gunicorn worker on every tour load.
    # The path is pinned by CHARTER_MODEL_URL in app/services/CharterArchive.py
    # — keep the two in sync. Versioned with the code, so a long expiry is
    # safe; a replacement ships under a new filename.
    location /models/ {
        alias /home/leftoverrice/Downloads/presspoint/storage/public/models/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        # error_page, not try_files — see the alias note above.
        error_page 404 = @app;
    }

    # ── Application ───────────────────────────────────────────────────
    location / {
        include proxy_params;
        proxy_pass http://unix:/home/leftoverrice/Downloads/presspoint/presspoint.sock;

        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Fallback for the static blocks above: anything nginx cannot find on
    # disk still reaches the Python handler, so a wrong path mapping
    # degrades to the old behaviour instead of 404ing a real file.
    # Once /var/log/nginx/presspoint_gray_raven.log shows no /storage/ or
    # /assets/ hits, these fallbacks are provably unused.
    location @app {
        include proxy_params;
        proxy_pass http://unix:/home/leftoverrice/Downloads/presspoint/presspoint.sock;

        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
    }
}
